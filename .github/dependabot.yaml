version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    labels:
      - "dependencies"
  - package-ecosystem: npm
    directory: "/examples/js-client"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
  - package-ecosystem: maven
    directory: "/examples/java-client"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
